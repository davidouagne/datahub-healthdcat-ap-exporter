name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# permissions minimales par défaut ; chaque job élève ce dont il a besoin
# (ADR-0003 / #20).
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Installer les dépendances de dev
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pip-audit (advisory)
        continue-on-error: true
        run: uv run pip-audit

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Installer les dépendances de dev
        run: uv sync --frozen

      - name: mypy --strict
        run: uv run mypy src/dh_healthdcat

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # upload Codecov OIDC, sans token (#18)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances de dev
        run: uv sync --frozen

      - name: pytest + couverture
        run: uv run pytest --cov=dh_healthdcat --cov-report=xml --cov-fail-under=90

      - name: Upload couverture vers Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Construire le wheel
        run: uv build

      - name: Installer le wheel dans un venv neuf (non-éditable)
        run: |
          uv venv .venv-wheel
          uv pip install --python .venv-wheel dist/*.whl

      - name: Fumée CLI (dh-healthdcat --help)
        run: .venv-wheel/bin/dh-healthdcat --help

      - name: Fumée données embarquées (vocabulaires + shapes SHACL)
        run: |
          .venv-wheel/bin/python -c "
          from rdflib import Graph
          from dh_healthdcat.mapping.vocabularies import ACCESS_RIGHTS
          from dh_healthdcat.validate.shacl import validate_graph

          # Échoue si mapping/vocab/AccessRights.yml n'a pas été empaqueté.
          assert ACCESS_RIGHTS.resolve('PUBLIC').startswith('http://publications.europa.eu/')

          # Échoue si validate/shapes/hdap-validator-sensitivity-shape.ttl
          # n'a pas été empaqueté (pyshacl ne trouverait aucune shape à charger).
          result = validate_graph(Graph())
          assert result.conforms
          print('Données embarquées (vocab + shapes SHACL) chargées avec succès.')
          "

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
