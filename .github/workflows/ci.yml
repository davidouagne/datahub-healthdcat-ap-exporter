name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# permissions minimales par défaut ; chaque job élève ce dont il a besoin
# (ADR-0003 / #20).
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Installer les dépendances de dev
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pip-audit (advisory)
        continue-on-error: true
        run: uv run pip-audit

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Installer les dépendances de dev
        run: uv sync --frozen

      - name: mypy --strict
        run: uv run mypy src/dh_healthdcat

  test:
    name: test (${{ matrix.resolution }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # upload Codecov OIDC, sans token (#18)
    strategy:
      fail-fast: false
      # highest : le lock (maintenu au plus haut par Dependabot).
      # lowest : planchers déclarés dans pyproject.toml, dont celui
      # d'acryl-datahub (plage des Versions DataHub supportées, ADR-0004).
      matrix:
        include:
          - { resolution: highest, python-version: "3.11" }
          - { resolution: highest, python-version: "3.12" }
          - { resolution: lowest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances (lock)
        if: matrix.resolution == 'highest'
        run: uv sync --frozen

      # Hors lock : `uv pip` résout sans réécrire uv.lock ; les étapes
      # suivantes passent par `--no-sync` pour ne pas resynchroniser sur le lock.
      - name: Installer les dépendances (planchers)
        if: matrix.resolution == 'lowest'
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e . --group dev

      - name: Versions résolues
        run: uv pip list | grep -E -i '^(acryl-datahub|rdflib|pyshacl|httpx|typer|click|pyyaml) '

      - name: pytest + couverture
        run: uv run --no-sync pytest --cov=dh_healthdcat --cov-report=xml --cov-fail-under=90

      - name: Upload couverture vers Codecov
        if: always() && matrix.resolution == 'highest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Construire le wheel
        run: uv build

      - name: Installer le wheel dans un venv neuf (non-éditable)
        run: |
          uv venv .venv-wheel
          uv pip install --python .venv-wheel dist/*.whl

      - name: Fumée CLI (dh-healthdcat --help)
        run: .venv-wheel/bin/dh-healthdcat --help

      - name: Fumée données embarquées (vocabulaires + shapes SHACL)
        run: |
          .venv-wheel/bin/python -c "
          from rdflib import Graph
          from dh_healthdcat.mapping.vocabularies import ACCESS_RIGHTS
          from dh_healthdcat.validate.shacl import validate_graph

          # Échoue si mapping/vocab/AccessRights.yml n'a pas été empaqueté.
          assert ACCESS_RIGHTS.resolve('PUBLIC').startswith('http://publications.europa.eu/')

          # Échoue si validate/shapes/hdap-validator-sensitivity-shape.ttl
          # n'a pas été empaqueté (pyshacl ne trouverait aucune shape à charger).
          result = validate_graph(Graph())
          assert result.conforms
          print('Données embarquées (vocab + shapes SHACL) chargées avec succès.')
          "

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
