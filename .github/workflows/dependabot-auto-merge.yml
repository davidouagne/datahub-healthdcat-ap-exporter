name: Dependabot auto-merge

# Auto-merge des PR Dependabot (ADR-0003 / #24) : patch partout, minor pour
# les dépendances de dev et les transitives (#110). Les version updates
# ignorent les transitives : une PR `indirect` est toujours une security
# update. Les majors restent en revue humaine. `gh pr merge --auto` attend que les
# checks requis soient verts et ne contourne aucune règle de branche.
#
# Type de montée : sur une security update `indirect`, le message de commit
# ne porte pas la version précédente et fetch-metadata rend un `update-type`
# vide (#113). On le déduit alors du titre « from X to Y » en comparant les
# deux premiers composants de version ; titre non reconnu → pas d'auto-merge.
# `--rebase` : seule méthode de merge autorisée sur `main` (ADR-0002 §1).
#
# Jeton (ADR-0003 §4) : l'auto-merge est activé avec le PAT fine-grained du
# mainteneur, stocké en secret *Dependabot* AUTO_MERGE_TOKEN (un workflow
# déclenché par Dependabot ne voit que les secrets Dependabot, pas les
# secrets Actions). Le merge est alors attribué au mainteneur : son push sur
# `main` déclenche release.yml (release-please met à jour la PR de release)
# et ci.yml. Avec GITHUB_TOKEN, GitHub ne déclenche aucun workflow sur ce
# push. Secret absent : repli sur GITHUB_TOKEN avec un avertissement — la PR
# est toujours mergée, mais release-please attend le prochain push sur main.
#
# `branches: [main]` : le PAT n'agit que sur des PR visant la branche
# couverte par le ruleset `main` et ses checks requis.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Métadonnées Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Type de montée
        id: bump
        env:
          META_UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          update_type="$META_UPDATE_TYPE"
          [ "$update_type" = "null" ] && update_type=""
          pattern=' from ([0-9][^ ]*) to ([0-9][^ ]*)( in .*)?$'
          if [ -z "$update_type" ] && [[ "$PR_TITLE" =~ $pattern ]]; then
            IFS=. read -r old_major old_minor _ <<< "${BASH_REMATCH[1]}"
            IFS=. read -r new_major new_minor _ <<< "${BASH_REMATCH[2]}"
            if [ "$old_major" != "$new_major" ]; then
              update_type="version-update:semver-major"
            elif [ "$old_minor" != "$new_minor" ]; then
              update_type="version-update:semver-minor"
            else
              update_type="version-update:semver-patch"
            fi
            echo "update-type déduit du titre : $update_type"
          fi
          echo "update-type=$update_type" >> "$GITHUB_OUTPUT"

      - name: Activer l'auto-merge
        if: >-
          steps.bump.outputs.update-type == 'version-update:semver-patch' ||
          (steps.bump.outputs.update-type == 'version-update:semver-minor' &&
          (steps.meta.outputs.dependency-type == 'direct:development' ||
          steps.meta.outputs.dependency-type == 'indirect'))
        env:
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -n "$AUTO_MERGE_TOKEN" ]; then
            export GH_TOKEN="$AUTO_MERGE_TOKEN"
          else
            echo "::warning::Secret Dependabot AUTO_MERGE_TOKEN absent — repli sur GITHUB_TOKEN ; le merge ne déclenchera pas release.yml (ADR-0003 §4)."
            export GH_TOKEN="$GITHUB_TOKEN_FALLBACK"
          fi
          gh pr merge --auto --rebase "$PR_URL"
