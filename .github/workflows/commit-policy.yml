name: Commit policy

# ADR-0002 : chaque commit d'une PR est un Conventional Commit signé DCO.
# Merge par rebase : ces commits atterrissent tels quels sur `main`, le titre
# de PR n'entre pas dans l'historique et n'est donc pas vérifié.
# Bornage BASE..HEAD → non rétroactif.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifier le trailer Signed-off-by sur chaque commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::$sha : pas de trailer 'Signed-off-by:' — utilisez git commit -s"
              rc=1
            fi
          done
          exit $rc

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
