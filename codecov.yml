# Barrière de couverture (ADR-0003 / #18, informational : #65 / #69,
# seuil 90% : #79). Codecov est purement informatif : la vraie barrière (90%)
# tourne dans `pytest --cov-fail-under=90` (ci.yml, job `test`), pas ici. Une
# panne Codecov ou une PR de fork sans jeton OIDC ne peut donc plus faire
# échouer la CI pour une raison étrangère à la couverture réelle.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: true
    patch:
      default:
        target: 90%
        informational: true

ignore:
  - "tests/**"
