# Aligné sur ADR-0003. Les hooks ruff sont `language: system` et appellent
# `uv run ruff` : la version provient d'uv.lock, strictement identique à celle
# de la CI (pas de `rev` de mirror qui dériverait). mypy reste CI-only — le
# passage strict est trop bruyant pour un hook local.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
