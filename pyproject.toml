[project]
name = "dh-healthdcat"
version = "0.1.0"
description = "Exporteur DataHub -> HealthDCAT-AP (fichier Turtle et API du catalogue HDH)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Épinglé pour rester compatible avec acryl-datahub[rdf], voir
    # datahub-project/datahub/metadata-ingestion/setup.py:733
    "rdflib==6.3.2",
    "pyshacl>=0.25,<0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "acryl-datahub>=0.14.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
dh-healthdcat = "dh_healthdcat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dh_healthdcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
